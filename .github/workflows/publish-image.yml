name: Test and publish container

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: python -m pytest -q
      - run: python -m compileall -q app tests tools scripts

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=sha,format=long
      - name: Build restart acceptance image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          platforms: linux/amd64
          load: true
          tags: immich-booru-tagger:progress-test
          cache-from: type=gha
      - name: Offline container restart acceptance
        run: python3 scripts/check_container_restart.py --image immich-booru-tagger:progress-test
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          load: true
          tags: immich-booru-tagger:check
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Offline image smoke test
        run: |
          docker run --rm immich-booru-tagger:check python -m app.main --help
          docker run --rm immich-booru-tagger:check python -c "import wdtagger, torch; assert not torch.cuda.is_available(); print(torch.__version__)"
          docker run -d --name tagger-smoke --network none -e IMMICH_BASE_URL=http://unused -e IMMICH_API_KEY=test immich-booru-tagger:check python -m app.main --mode health-only
          trap 'docker logs tagger-smoke; docker rm -f tagger-smoke' EXIT
          for attempt in $(seq 1 20); do
            if docker exec tagger-smoke python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: github.event_name != 'pull_request'
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
