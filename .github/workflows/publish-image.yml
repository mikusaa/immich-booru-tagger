name: Test and publish container

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: python -m pytest -q
      - run: python -m compileall -q app tests tools scripts
      - name: Native macOS CPU inference contract
        if: runner.os == 'macOS'
        run: |
          pip install -r requirements.txt
          python -m scripts.check_inference_runtime

  image:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build restart acceptance image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: immich-booru-tagger:progress-test
          cache-from: type=gha,scope=test-${{ matrix.arch }}
          cache-to: type=gha,scope=test-${{ matrix.arch }},mode=max
      - name: Offline container restart acceptance
        run: python3 scripts/check_container_restart.py --image immich-booru-tagger:progress-test
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: immich-booru-tagger:check
          cache-from: type=gha,scope=runtime-${{ matrix.arch }}
          cache-to: type=gha,scope=runtime-${{ matrix.arch }},mode=max
      - name: Offline image smoke test
        run: |
          docker run --rm immich-booru-tagger:check python -m app.main --help
          docker run --rm immich-booru-tagger:check python -c "import wdtagger, torch; assert not torch.cuda.is_available(); print(torch.__version__)"
          docker run --rm --network none immich-booru-tagger:check python -m scripts.check_inference_runtime
          docker run -d --name tagger-smoke --network none -e IMMICH_BASE_URL=http://unused -e IMMICH_API_KEY=test immich-booru-tagger:check python -m app.main --mode health-only
          trap 'docker logs tagger-smoke; docker rm -f tagger-smoke' EXIT
          for ((attempt=1; attempt<=20; attempt++)); do
            if docker exec tagger-smoke python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push verified architecture by digest
        uses: docker/build-push-action@v6
        id: push
        if: github.event_name != 'pull_request'
        with:
          context: .
          target: runtime
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=runtime-${{ matrix.arch }}
      - name: Save architecture digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  manifest:
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Require reviewed Apple Silicon acceptance for stable tags
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        run: python3 -m scripts.check_release_acceptance
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=sha,format=long
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Publish multi-architecture manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          META_JSON: ${{ steps.meta.outputs.json }}
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< "$META_JSON")
          tag_args=()
          for tag in "${tags[@]}"; do tag_args+=(--tag "$tag"); done
          refs=()
          for digest in *; do refs+=("${IMAGE}@sha256:${digest}"); done
          test "${#refs[@]}" -eq 2
          docker buildx imagetools create "${tag_args[@]}" "${refs[@]}"
          docker buildx imagetools inspect "${tags[0]}"
