services:
  immich-tagger:
    image: ${TAGGER_IMAGE:-ghcr.io/mikusaa/immich-booru-tagger:1.3.0}
    platform: linux/amd64
    container_name: immich-booru-tagger
    env_file: .env
    environment:
      MODEL_CACHE_DIR: /app/models
      HF_HUB_CACHE: /app/models
      STATE_DIR: /app/state
    volumes:
      - ./models:/app/models
      - ./state:/app/state
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    stop_grace_period: 90s
